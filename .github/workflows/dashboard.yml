
name: Dashboard Deploy

on:
  push:
    paths:
      - 'terraform/dashboard-ui/**'
      - 'terraform/modules/dashboard/**'
      - '.github/workflows/dashboard.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    env:
      TF_VAR_ssh_public_key: ${{ secrets.EC2_PUBLIC_KEY }}

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::307946654556:role/github-actions-terraform-role
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init  

      - name: Terraform Apply Dashboard
        run: terraform apply -auto-approve

      - name: Upload Frontend
        working-directory: terraform/dashboard-ui
        run: |
          aws s3 cp . s3://itai-cloud-ops-dashboard \
            --recursive \
            --exclude ".git/*"
